# Look & feel of the app — plain TOML settings, no HTML/CSS needed.

[client]
toolbarMode = "minimal"

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 700, 650, 600, 600, 600]
baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontWeight = 700
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.light]
primaryColor = "#557A49"
backgroundColor = "#F8F7F3"
secondaryBackgroundColor = "#EDF0E7"
textColor = "#2B302A"
borderColor = "#E0DDD4"
dataframeHeaderBackgroundColor = "#EDF0E7"
greenColor = "#557A49"
codeBackgroundColor = "#EFEEE8"

[theme.dark]
primaryColor = "#6E9160"
backgroundColor = "#1B1C19"
secondaryBackgroundColor = "#262823"
textColor = "#EDEFEA"
borderColor = "#393B34"
dataframeHeaderBackgroundColor = "#262823"
greenColor = "#8DA67F"
codeBackgroundColor = "#23251F"
